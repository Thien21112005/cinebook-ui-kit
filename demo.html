<!DOCTYPE html>
<html lang="vi" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineBook — Live Interactive Wireframe Web Demo</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-app: #0f141c;
      --bg-bar: #18202c;
      --border-bar: rgba(255, 255, 255, 0.12);
      --text-white: #ffffff;
      --text-gray: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-app);
      color: var(--text-white);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Control Bar */
    header.demo-bar {
      height: 60px;
      background: var(--bg-bar);
      border-bottom: 1px solid var(--border-bar);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 100;
      flex-shrink: 0;
    }

    .demo-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #ffffff;
    }
    .demo-logo {
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    /* Simulated Browser URL Bar */
    .browser-omnibar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-bar);
      padding: 6px 14px;
      border-radius: 20px;
      width: 420px;
      max-width: 35vw;
    }
    .url-lock {
      font-size: 14px;
      color: #10b981;
    }
    .url-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* Quick Flow Steps Dropdown */
    .flow-selector {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-bar);
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      outline: none;
    }
    .flow-selector option {
      background: #18202c;
      color: #ffffff;
    }

    /* Device Switcher */
    .device-group {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-bar);
      padding: 2px;
      border-radius: 8px;
      gap: 2px;
    }
    .device-btn {
      background: transparent;
      border: none;
      color: var(--text-gray);
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      transition: all 0.15s ease;
    }
    .device-btn:hover {
      color: #ffffff;
    }
    .device-btn.active {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-weight: 600;
    }

    /* Action Buttons */
    .btn-action {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 7px 14px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease;
    }
    .btn-action:hover {
      background: var(--accent-hover);
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border-bar);
      color: #cbd5e1;
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    /* Viewport Area */
    main.demo-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090d13;
      padding: 16px;
      overflow: hidden;
      position: relative;
    }

    .frame-container {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), height 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }

    /* Responsive Frame Sizes */
    .frame-container.desktop {
      width: 100%;
      height: 100%;
    }
    .frame-container.macbook {
      width: 1280px;
      height: 100%;
      max-width: 96vw;
    }
    .frame-container.tablet {
      width: 768px;
      height: 100%;
    }
    .frame-container.mobile {
      width: 393px;
      height: 852px;
      max-height: 94vh;
      border-radius: 36px;
      border: 10px solid #222;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1), 0 25px 50px rgba(0, 0, 0, 0.8);
    }

    iframe#liveFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    /* Bottom Quick Journey Indicator */
    .journey-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(24, 32, 44, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-bar);
      border-radius: 30px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      z-index: 90;
    }
    .journey-step {
      font-size: 12px;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border-radius: 16px;
      transition: all 0.15s ease;
    }
    .journey-step:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }
    .journey-step.active {
      color: #38bdf8;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.15);
    }
    .journey-divider {
      color: rgba(255, 255, 255, 0.2);
      font-size: 10px;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="demo-bar">
    <div style="display: flex; align-items: center; gap: 16px;">
      <a href="index.html" class="demo-brand" title="Quay lại Canvas Board">
        <div class="demo-logo">🎬</div>
        <div style="display: flex; flex-direction: column;">
          <strong style="font-size: 14px;">CineBook Live Prototype</strong>
          <span style="font-size: 10.5px; color: var(--text-gray);">Interactive Wireframe Web App</span>
        </div>
      </a>

      <!-- Quick Step Selector -->
      <select class="flow-selector" id="screenSelector" onchange="jumpToScreen(this.value)">
        <optgroup label="🎬 Hành trình Đặt vé Khách hàng (User Flow)">
          <option value="1_cinebook_home_page">1. Trang chủ (Home Page)</option>
          <option value="2_cinebook_movie_list">2. Danh sách phim & Bộ lọc</option>
          <option value="3_cinebook_ai_search">3. Tìm kiếm phim AI Semantic</option>
          <option value="4_cinebook_movie_detail">4. Chi tiết phim & Lịch chiếu</option>
          <option value="6_cinebook_seat_selection">6. Chọn ghế trực tiếp (Redis Redlock)</option>
          <option value="7_cinebook_combo_snacks">7. Chọn bắp nước Combo</option>
          <option value="8_cinebook_payment_checkout">8. Xác nhận đơn & Thanh toán</option>
          <option value="9_cinebook_booking_success">9. Đặt vé thành công & QR</option>
        </optgroup>
        <optgroup label="🔒 Khách hàng (User Account & Auth)">
          <option value="12_cinebook_ticket_details">12. Chi tiết vé & Mã QR</option>
          <option value="13_cinebook_user_profile">13. Hồ sơ & Điểm thành viên</option>
          <option value="26_cinebook_my_tickets">26. Vé của tôi</option>
          <option value="27_cinebook_membership_points">27. Điểm thưởng & Hạng thành viên</option>
          <option value="28_cinebook_preferences">28. Cài đặt tài khoản</option>
          <option value="14_cinebook_personalized_recommendations">14. Gợi ý phim cá nhân hóa</option>
        </optgroup>
        <optgroup label="🏢 Nhân viên Rạp & Soát vé (Staff Flow)">
          <option value="18_cinebook_ticket_check_in">18. Soát vé QR tại quầy rạp</option>
          <option value="15_cinebook_staff_dashboard">15. Dashboard nhân viên rạp</option>
          <option value="16_cinebook_manage_showtimes">16. Quản lý suất & lịch chiếu</option>
          <option value="17_cinebook_manage_halls">17. Quản lý phòng chiếu & sơ đồ ghế</option>
          <option value="19_cinebook_staff_revenue_report">19. Báo cáo doanh thu rạp</option>
        </optgroup>
        <optgroup label="🛡️ Quản trị Toàn hệ thống (Admin Flow)">
          <option value="20_cinebook_admin_global_dashboard">20. Dashboard quản trị Admin</option>
          <option value="21_cinebook_manage_movies">21. Quản lý danh mục phim</option>
          <option value="22_cinebook_manage_cinemas">22. Quản lý cụm rạp toàn quốc</option>
          <option value="23_cinebook_user_management">23. Quản lý người dùng & RBAC</option>
          <option value="24_cinebook_promotions_management">24. Quản lý khuyến mãi & Voucher</option>
          <option value="25_cinebook_system_monitoring">25. Giám sát Prometheus/Grafana</option>
        </optgroup>
      </select>
    </div>

    <!-- Browser URL Bar -->
    <div class="browser-omnibar">
      <span class="material-symbols-outlined url-lock">lock</span>
      <span class="url-text" id="simulatedUrl">https://cinebook.vn/</span>
      <span class="material-symbols-outlined" style="font-size: 16px; color: #64748b; cursor: pointer;" onclick="reloadFrame()" title="Tải lại trang">refresh</span>
    </div>

    <!-- Device Selector & Canvas Link -->
    <div style="display: flex; align-items: center; gap: 12px;">
      <div class="device-group">
        <button class="device-btn active" onclick="setDevice('desktop', this)" title="Toàn màn hình">
          <span class="material-symbols-outlined" style="font-size: 16px;">fullscreen</span> Full
        </button>
        <button class="device-btn" onclick="setDevice('macbook', this)" title="Laptop 1280px">
          <span class="material-symbols-outlined" style="font-size: 16px;">laptop</span> Laptop
        </button>
        <button class="device-btn" onclick="setDevice('tablet', this)" title="Tablet 768px">
          <span class="material-symbols-outlined" style="font-size: 16px;">tablet_mac</span> Tablet
        </button>
        <button class="device-btn" onclick="setDevice('mobile', this)" title="Mobile 393px">
          <span class="material-symbols-outlined" style="font-size: 16px;">smartphone</span> Mobile
        </button>
      </div>

      <a href="index.html" class="btn-action btn-outline">
        <span class="material-symbols-outlined" style="font-size: 16px;">grid_view</span>
        Về Canvas Board
      </a>
    </div>
  </header>

  <!-- Interactive Live Stage -->
  <main class="demo-stage">
    <div class="frame-container desktop" id="frameContainer">
      <iframe id="liveFrame" src="wireframe_design_assistant/1_cinebook_home_page/code.html"></iframe>
    </div>
  </main>

  <!-- Bottom Quick Steps Indicator -->
  <div class="journey-bar">
    <div class="journey-step active" onclick="jumpToScreen('1_cinebook_home_page')">1. Trang chủ</div>
    <span class="journey-divider">➔</span>
    <div class="journey-step" onclick="jumpToScreen('4_cinebook_movie_detail')">2. Phim</div>
    <span class="journey-divider">➔</span>
    <div class="journey-step" onclick="jumpToScreen('6_cinebook_seat_selection')">3. Chọn ghế</div>
    <span class="journey-divider">➔</span>
    <div class="journey-step" onclick="jumpToScreen('7_cinebook_combo_snacks')">4. Bắp nước</div>
    <span class="journey-divider">➔</span>
    <div class="journey-step" onclick="jumpToScreen('8_cinebook_payment_checkout')">5. Thanh toán</div>
    <span class="journey-divider">➔</span>
    <div class="journey-step" onclick="jumpToScreen('9_cinebook_booking_success')">6. Vé QR</div>
    <span class="journey-divider">➔</span>
    <div class="journey-step" onclick="jumpToScreen('18_cinebook_ticket_check_in')">7. Soát vé</div>
  </div>

  <script>
    const iframe = document.getElementById('liveFrame');
    const selector = document.getElementById('screenSelector');
    const urlDisplay = document.getElementById('simulatedUrl');
    const container = document.getElementById('frameContainer');

    const URL_MAPPING = {
      '1_cinebook_home_page': 'https://cinebook.vn/',
      '2_cinebook_movie_list': 'https://cinebook.vn/movies',
      '3_cinebook_ai_search': 'https://cinebook.vn/search?ai=true',
      '4_cinebook_movie_detail': 'https://cinebook.vn/movies/the-architects-dream',
      '5_cinebook_ai_assistant': 'https://cinebook.vn/ai-assistant',
      '6_cinebook_seat_selection': 'https://cinebook.vn/booking/seat-selection',
      '7_cinebook_combo_snacks': 'https://cinebook.vn/booking/combos',
      '8_cinebook_payment_checkout': 'https://cinebook.vn/booking/checkout',
      '9_cinebook_booking_success': 'https://cinebook.vn/booking/success',
      '10_cinebook_login_register': 'https://cinebook.vn/auth/login',
      '11_cinebook_booking_history': 'https://cinebook.vn/account/tickets',
      '12_cinebook_ticket_details': 'https://cinebook.vn/ticket/CB-89214',
      '13_cinebook_user_profile': 'https://cinebook.vn/account/profile',
      '14_cinebook_personalized_recommendations': 'https://cinebook.vn/recommendations',
      '15_cinebook_staff_dashboard': 'https://cinebook.vn/staff/dashboard',
      '16_cinebook_manage_showtimes': 'https://cinebook.vn/staff/showtimes',
      '17_cinebook_manage_halls': 'https://cinebook.vn/staff/halls',
      '18_cinebook_ticket_check_in': 'https://cinebook.vn/staff/check-in',
      '19_cinebook_staff_revenue_report': 'https://cinebook.vn/staff/revenue',
      '20_cinebook_admin_global_dashboard': 'https://cinebook.vn/admin/dashboard',
      '21_cinebook_manage_movies': 'https://cinebook.vn/admin/movies',
      '22_cinebook_manage_cinemas': 'https://cinebook.vn/admin/cinemas',
      '23_cinebook_user_management': 'https://cinebook.vn/admin/users',
      '24_cinebook_promotions_management': 'https://cinebook.vn/admin/vouchers',
      '25_cinebook_system_monitoring': 'https://cinebook.vn/admin/monitoring'
    };

    function jumpToScreen(folder) {
      iframe.src = `wireframe_design_assistant/${folder}/code.html`;
      selector.value = folder;
      urlDisplay.innerText = URL_MAPPING[folder] || `https://cinebook.vn/${folder}`;
      updateJourneyHighlight(folder);
    }

    function reloadFrame() {
      iframe.src = iframe.src;
    }

    function setDevice(device, btn) {
      document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      container.className = `frame-container ${device}`;
    }

    function updateJourneyHighlight(folder) {
      document.querySelectorAll('.journey-step').forEach(step => {
        if (step.getAttribute('onclick').includes(folder)) {
          step.classList.add('active');
        } else {
          step.classList.remove('active');
        }
      });
    }

    // Listen to in-iframe URL changes if possible
    iframe.addEventListener('load', () => {
      try {
        const path = iframe.contentWindow.location.pathname;
        const match = path.match(/([0-9]+_cinebook_[^/]+)/);
        if (match) {
          const folder = match[1];
          selector.value = folder;
          urlDisplay.innerText = URL_MAPPING[folder] || `https://cinebook.vn/${folder}`;
          updateJourneyHighlight(folder);
        }
      } catch (e) {}
    });
  </script>
</body>
</html>
